[project]
name = "dolby-tool"
version = "0.1.0"
description = "Local web app for inspecting Dolby Vision / HDR / Atmos files and live-capturing TV.app playback specs"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
dolby-tool = "dolby_tool.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
